[model]
id = "poziomka_iter_0001718"
tokenizer = "../../Ling-V2/poziomka_sft_2026_09_14_hf/iter_0001718"
tokenizer_subfolder = ""
trust_remote_code = true

[chat_template]
# Omit this key if the model's template should use its default behavior.
enable_thinking = true

[api]
base_url = "http://192.168.1.26:2300"
# Served model name, as the endpoint reports it. Leave empty only as a fallback:
# the runner then queries /models once and uses the first entry.
model = "poziomka_iter_0001718"
# Questions in flight at once (default 8, or --concurrency). Turns within a
# question stay sequential, so this only batches independent questions and does
# not change what is generated.
concurrency = 16
# api_key_env = "OPENAI_API_KEY"
timeout = 600

[generation]
max_tokens = 7000
temperature = 0.4
top_p = 0.9
top_k = 40
repetition_penalty = 1.01
stop = ["<|im_end|>"]
