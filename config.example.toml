[model]
id = "model-name"
tokenizer = "/path/to/tokenizer-or-model"
tokenizer_subfolder = ""
trust_remote_code = false

[chat_template]
# Omit this key if the model's template should use its default behavior.
enable_thinking = false

[api]
base_url = "http://localhost:8000/v1"
model = "served-model-name"
# api_key_env = "OPENAI_API_KEY"
timeout = 600

[generation]
max_tokens = 2048
temperature = 0.7
top_p = 0.9
seed = 42
