# Judge config for the Łodyga 0.1 evaluation. Sampling is frozen for a whole
# run — every judged turn uses these same values — and this file is archived
# with every run's results.
[api]
base_url = "https://openrouter.ai/api/v1"
model = "openai/gpt-5.6-luna"
api_key_env = "OPENROUTER_API_KEY"
timeout = 600
max_retries = 5
# Turns judged at once. Judging is latency-bound, so this is the main lever on
# wall-clock: 160 turns took 327 s serially and 22 s at 16. Raise carefully —
# OpenRouter rate limits apply per key.
concurrency = 16

# Every key below is sent verbatim to the chat-completions endpoint, so it must
# be a parameter the judge model actually supports. gpt-5.6-luna is a reasoning
# model: it accepts `seed`, `max_tokens`, and `reasoning_effort`, but NOT
# `temperature` or `top_p`. Listing unsupported knobs here would archive a
# determinism claim the run does not have, so they are omitted deliberately.
# Check `supported_parameters` on https://openrouter.ai/api/v1/models before
# switching to a different judge.
[generation]
seed = 42
# gpt-5.6-luna accepts: none, low, medium (the model default), high, xhigh, max.
# Łodyga 0.1 pins "none": the judge scores straight from the rubric prompt, which
# is cheaper and more reproducible. Pinning it also means a change to the model's
# default effort cannot silently move published scores.
reasoning_effort = "none"
# With reasoning off the judge only emits the rubric JSON (~200 tokens), so this
# is pure headroom. A judge that runs out of budget before closing the JSON is
# recorded as unscored, never retried and never imputed.
max_tokens = 2000
