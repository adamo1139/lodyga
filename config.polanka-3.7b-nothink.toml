# Polanka 3.7B przez chat API - czyli dokładnie tak, jak wystawia ją serwer.
#   vllm serve /media/nvme_2tb/maked/models/polanka --port 2300 --host 0.0.0.0
#
# Szablon w serwowanym katalogu nie otwiera bloku rozumowania, a
# chat_template_kwargs nic nie zmienia: model nie generuje `reasoning_content`
# ani przy true, ani przy false, ani bez kwargs. Dlatego to jest wariant
# "bez myślenia" i nie ma tu sekcji [chat_template] - nie ma na co wpływać.
[model]
id = "polanka_3.7b_nothink"

[api]
base_url = "http://192.168.1.26:2300/v1"
model = ""
mode = "chat"
concurrency = 100
timeout = 600

# eos Polanki to <|endoftext|>, nie <|im_end|>.
[generation]
max_tokens = 3500
temperature = 0.9
top_p = 0.9
top_k = 40
repetition_penalty = 1.05
stop = ["<|endoftext|>", "<|im_end|>"]
