# dots-studio/dots-3-note-preview:free przez OpenRouter.
[model]
id = "dots_3_note_preview"

[api]
base_url = "https://openrouter.ai/api/v1"
model = "dots-studio/dots-3-note-preview:free"
mode = "chat"
api_key_env = "OPENROUTER_API_KEY"
concurrency = 80
timeout = 1800

# Sampling protokolarny bez repetition penalty - jak przy gpt-oss. Kara za
# powtórzenia jest nie na miejscu przy modelu, który wraca do tych samych myśli
# w śladzie rozumowania.
# Ten dostawca nie obsługuje top_k ani repetition_penalty, więc sampling
# jest tu uboższy niż w reszcie tabeli.
#
# Ślad rozumowania wchodzi do tego samego budżetu co odpowiedź, stąd wysoki
# max_tokens. Siłę rozumowania przypinamy jawnie, żeby zmiana domyślnej wartości
# u dostawcy nie przesunęła po cichu wyniku.
[generation]
max_tokens = 40000
temperature = 0.9
top_p = 0.9
reasoning_effort = "high"
