# Poziomka run 11 (SFT polskie-sprawy-v6, szablon v13, 16384 packed, GBS 16),
# iter 2756, wariant think na KARZE ZA POWTORZENIA zamiast frequency_penalty.
#   serwer: /media/nvme_2tb/maked/poziomka_train/poziomka_sft_run11_polskie_sprawy_v6_v13_16384_gbs16_hf/iter_0002756
#
# Ten sam checkpoint co `-think-t08-topk40`, ten sam sampler poza karą: `fp 0,05`
# zamienione na `repetition_penalty 1,10`. Powod: na pelnym zestawie 80 pytan
# `rep` wypelnia tresciq o 27 tur wiecej.
#
# Sweep `sampler.py`, 80 pytan x 1 proba, OBIE tury, baza t0,8 / top_p 0,9 /
# top_k 40 / max_tokens 7800 we wszystkich wierszach (tury z odpowiedzia / 160):
#   bez kary            77    urwanych 83   slad 9335   odp.  351
#   rep 1,01           102    urwanych 65   slad 3646   odp.  670
#   rep 1,02            95    urwanych 64   slad 3713   odp.  677
#   rep 1,03           111    urwanych 49   slad 3621   odp.  573
#   rep 1,05           125    urwanych 35   slad 3248   odp.  907
#   rep 1,07           129    urwanych 24   slad 3482   odp.  984
#   rep 1,10           140    urwanych 16   slad 3532   odp. 1092   <- wybrane
#   rep 1,15           134    urwanych 16   slad 3864   odp. 1656
#   rep 1,05 + fp 0,05 117    urwanych 13   slad 3605   odp. 1195
#   fp 0,05            113    urwanych  5   slad 4646   odp.  932   <- poprzednie
#
# Cztery rzeczy z tego sweepu:
# - BEZ zadnej kary model sie zapetla: 83 ze 160 tur gina na budzecie, slad 9335
#   znakow. `</think>` to piec zwyklych tokenow APT4, wiec jakas kara jest
#   konieczna, zeby model z bloku wyszedl. Z tego samego powodu serwer wymaga
#   `--grammar-backend none`.
# - Zaleznosc od `rep` jest MONOTONICZNA do 1,10 i cofa sie przy 1,15 - inaczej
#   niz przy `fp`, gdzie optimum bylo w 0,05, a 0,15 juz psulo.
# - LACZENIE kar szkodzi: `rep 1,05 + fp 0,05` daje 117, czyli mniej niz `rep
#   1,05` samo (125). Decyduje wiec LACZNA kara, nie to, ktory mechanizm ja
#   naklada.
# - Serwer NIE MA okna kary. `repeat_last_n`, `penalty_last_n`
#   i `repetition_penalty_range` sglang przyjmuje bez bledu i IGNORUJE: przy
#   `rep 2,0` i oknie 1 tekst jest co do znaku taki jak bez okna, a nie taki jak
#   przy `rep 1,0`. `repeat_last_n` to parametr llama.cpp; sglang liczy kare po
#   calej sekwencji.
#
# UWAGA, CZYTANE SLADY: kara wyprowadza model z bloku, ale NIE poprawia tresci.
# Na tych samych pytaniach `rep 1,10` i `fp 0,05` myla sie tak samo - pole
# trojkata (0,0), (-1,1), (3,3) wychodzi 0 albo 7 zamiast 3, zagadka wyscigu
# traktowana jest jak zadanie z kinematyki, a w kategorii `writing` model
# konfabuluje nieistniejace jeziora i wpisuje iPhone'a 16 na liste cech Xiaomi.
# Roznica jest tylko mechaniczna: `fp` krecilo sie w sladzie 14 367 znakow i nie
# odpowiadalo, `rep` konczy slad po ~1000 znakow i odpowiada blednie. Ten wiersz
# dokumentuje wiec najlepszy sampler, a nie nadzieje na wyzsza ocene; wariant
# think ogranicza zdolnosc modelu przy 8,2% rozumowania w v6, nie parametry.
[model]
id = "poziomka_run11_v6_gbs16_ctx16k_think_rep110"

[chat_template]
enable_thinking = true

[api]
base_url = "http://192.168.1.26:2300/v1"
model = "/media/nvme_2tb/maked/poziomka_train/poziomka_sft_run11_polskie_sprawy_v6_v13_16384_gbs16_hf/iter_0002756"
mode = "chat"
concurrency = 80
timeout = 600

[generation]
max_tokens = 7800
temperature = 0.8
top_p = 0.9
top_k = 40
repetition_penalty = 1.10
stop = ["<|im_end|>"]
