# Poziomka SFT run2 v11, checkpoint iter_0001718, served by SGLang.
[model]
id = "poziomka_iter_0001718"
# Tokenizer must match the served checkpoint. The cached HF copy of the same
# family is used locally so the chat template is rendered without a download.
tokenizer = "/home/adamo/.cache/huggingface/hub/models--cpral--poziomka_sft_2026_09_14_hf/snapshots/9a821cfb9a8a0db057ddb854ae478a30f445f288/iter_0000400"
trust_remote_code = true

[chat_template]
enable_thinking = true

[api]
base_url = "http://192.168.1.26:2300/v1"
model = "/media/nvme_2tb/maked/poziomka_train/poziomka_sft_run2_v11_8192_hf/iter_0001718"
timeout = 600
# Questions in flight at once. The two turns of one question stay sequential —
# turn 2 needs turn 1 in its prompt — so this parallelises across questions and
# lets SGLang batch them. Sampling is unaffected, so results do not depend on it.
concurrency = 80

# max_tokens must be set explicitly: the OpenAI /v1/completions default is 16
# tokens, so omitting it truncates every answer rather than lifting the limit.
# Sized to the 8192-token server window. Turn 2 carries only the turn-1 answer
# (the reasoning trace is dropped), so the worst case is
# q1 401 + answer 3500 + q2 325 + template 40 = 4266 prompt, + 3500 generated
# = 7766, inside the window.
[generation]
max_tokens = 3500
temperature = 0.9
top_p = 0.9
top_k = 40
repetition_penalty = 1.05
stop = ["<|im_end|>"]
