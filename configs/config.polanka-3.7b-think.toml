# Polanka 3.7B z rozumowaniem, przez /completions.
#
# Szablon z repo HF `piotr-ai/polanka_3.7b_exp_wip_260901` sam kończy prompt
# otwartym `<think>\n`, więc model zaczyna od rozumowania i domyka je przez
# `</think>`. Żaden prefill nie jest potrzebny.
#
# UWAGA: to szablon z repo HF, a nie ten, który ma serwowany katalog - tamten
# rozumowania nie otwiera. Ten wiersz mierzy więc, czy Polanka POTRAFI korzystać
# z rozumowania, a nie jak zachowuje się domyślnie po wystawieniu.
[model]
id = "polanka_3.7b_think"
tokenizer = "piotr-ai/polanka_3.7b_exp_wip_260901"
trust_remote_code = true

[api]
base_url = "http://192.168.1.26:2300/v1"
model = ""
mode = "completions"
concurrency = 80
timeout = 600

[generation]
max_tokens = 3500
temperature = 0.9
top_p = 0.9
top_k = 40
repetition_penalty = 1.05
stop = ["<|endoftext|>", "<|im_end|>"]
