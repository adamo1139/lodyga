# Poziomka run 7 (SFT polskie-sprawy-v3, szablon v13, 16384 packed, GBS 16),
# iter 0000846, wariant think.
#   serwer: /media/nvme_2tb/maked/poziomka_train/poziomka_sft_run7_polskie_sprawy_v3_v13_16384_gbs16_hf/iter_0000846
#
# Czesc zmiatania po wielkosci partii: run9 gbs768/18 iter, run6 gbs64/212,
# run8 gbs32/423, run7 gbs16/846. Kazdy run widzial tyle samo probek, rozni je
# tylko liczba krokow optymalizatora.
#
# frequency_penalty 0,05 zamiast 0,15 - DOBRANE SONDA na tym modelu, na obu
# turach, po 32 proby na wariant. Udzial tur z odpowiedzia (tura 1 / tura 2):
#   fp0,05   27/32  21/32   7/64 urwanych   <- wybrane
#   fp0,15   17/32  16/32   3/64            <- zestaw przeniesiony z merge'a -7
#   fp0,10   22/32  14/32   7/64
#   fp0,03   27/32  18/32  13/64
#   fp0,01   24/32  21/32  19/64
#   fp0,00   20/32  17/32  28/64
#   bez pola 15/32   9/32  34/64
# Temperatura przy fp0,05 nie ma znaczenia w turze 1 (t0,6/0,8/1,0 -> 27/28/28),
# a w turze 2 szkodzi w gore (t1,0 -> 17/32, 9/64 urwanych).
#
# Urwane tury rosna monotonicznie, im nizsza kara - bez kary model kreci sie
# w sladzie i wyczerpuje budzet. `</think>` to piec zwyklych tokenow APT4, wiec
# kara tlumi je jak kazdy inny powtorzony token; stad optimum, a nie zero.
#
# UWAGA: `fp0,00` i pominiecie pola daly ROZNE wyniki, choc domyslna wartosc to
# zero. Nie traktuj ich jak synonimow w opisach pomiarow.
#
# Tura 2 zostaje waskim gardlem nawet przy najlepszej karze: 21/32 wobec 27/32.
# Sonde dla wariantow think licz na turze 2 - na turze 1 zapowiadala dla run6
# ~15% pustych, a pelny przebieg dal 43%.
#
# Reszta samplingu skopiowana z
# `instruct-2026-09-30-7 (16k/640k)` i z wiersza run5, zeby partie dalo sie
# porownac miedzy soba i z modelem startowym. Serwer: okno 16384, RoPE 640000,
# `--grammar-backend none`.
#
# Szablon v13 naprawil przelacznik rozumowania: na zbiorze v3 z poprzednim
# szablonem `enable_thinking = true` dawalo 0 z 16 rozumujacych tur, tutaj 16
# z 16 we wszystkich czterech runach.
