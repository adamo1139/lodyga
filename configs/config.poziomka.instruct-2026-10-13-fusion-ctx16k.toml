# Arcee Fusion z tych samych skladnikow co 10-13-della. Wariant nothink.
#   serwer: /media/nvme_2tb/maked/poziomka_train/poziomka-instruct-2026-10-13-fusion
#
# Fusion nie bierze wag per model w taki sposob jak della_linear, wiec sklad
# zapisany jest w configu merge'a, nie tutaj. Ta sama linia zrodlowa:
# merge'e 10-10 + trajektoria run11, baza 09-30-7.
#
# Sampler PROTOKOLARNY, taki sam jak run11 (2,15), cala rodzina 10-10
# i 10-13-della (2,13), zeby wiersze byly porownywalne.
#
# Sonda: 0% smieci przy t0 i t0,8, 0/16 urwanych, 0 pustych i 0 zapetlonych
# w nothink. Odpowiedzi DLUZSZE niz w 10-13-della (1566 wobec 921 znakow przy
# t0,3) - sam fakt dlugosci nic nie mowi o jakosci, ale warto to pamietac przy
# czytaniu wyniku.
#
# ODNIESIENIA: run11/iter_0002756 2,15 (2,12-2,16) | 10-13-della 2,13
# (1,99-2,24) | 10-10-fusion 2,12 (1,99-2,24) | 10-10-della 2,12 (2,01-2,18).
# W osmiu merge'ach zaden nie pobil najlepszego skladnika; rozstep merge'ow
# w tej linii to okolo 0,25, czyli szesc razy wiecej niz czystego SFT.
[model]
id = "poziomka_instruct_2026_10_13_fusion_ctx16k"

[chat_template]
enable_thinking = false

[api]
base_url = "http://192.168.1.26:2300/v1"
model = "/media/nvme_2tb/maked/poziomka_train/poziomka-instruct-2026-10-13-fusion"
mode = "chat"
concurrency = 80
timeout = 600

[generation]
max_tokens = 7800
temperature = 0.6
top_p = 0.9
min_p = 0.05
frequency_penalty = 0.15
stop = ["<|im_end|>"]
