#
# Przelacznik rozumowania dziala: 16/16 rozumujacych tur przy enable_thinking
# = true, 0/32 przy false. Szablon v13 trzyma sie wiec takze na zbiorze v4.
#
# UWAGA: przez zmiane temperatury ten wiersz NIE jest wprost porownywalny
# z wierszami run5-run9 i merge'ami, ktore szly na t0,6. Reszta samplingu bez
# zmian (top_p 0,9, min_p 0,05, frequency_penalty 0,15, max_tokens 7800).
