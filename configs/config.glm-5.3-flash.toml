# GLM 5.3 Flash przez OpenRouter.
#
# UWAGA: to NIE jest ten sam artefakt co lokalna kwantyzacja exl3 3.05bpw.
# OpenRouter kieruje do dostawców serwujących model w pełnej precyzji, więc
# wiersz w tabeli opisuje model, a nie nasz lokalny kwant.
[model]
id = "glm_5.3_flash_openrouter"

[api]
base_url = "https://openrouter.ai/api/v1"
model = "z-ai/glm-5.3-flash"
mode = "chat"
# Ten sam klucz co sędzia.
api_key_env = "OPENROUTER_API_KEY"
concurrency = 80
timeout = 1800

# Sampling zalecany dla GLM 5.3 Flash, a nie ten z reszty tabeli: temperature
# 1.0, top_p 0.95, bez top_k i bez repetition penalty. Protokół dopuszcza
# sampling per model (custom_scoring.md, "Answer generation").
#
# max_tokens obejmuje ślad rozumowania razem z odpowiedzią - przy 3500 model
# wyczerpywał budżet na samym myśleniu. W próbce sam ślad sięgał 20 tys. znaków
# przy odpowiedzi poniżej 4 tys., więc limit musi mieć spory zapas. Kontekst
# u dostawców to 1M, więc 40000 nie zbliża się do żadnej granicy.
[generation]
max_tokens = 40000
temperature = 1.0
top_p = 0.95
