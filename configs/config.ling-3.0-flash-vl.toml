# inclusionai/ling-3.0-flash-vl przez OpenRouter.
[model]
id = "ling_3.0_flash_vl"

[api]
base_url = "https://openrouter.ai/api/v1"
model = "inclusionai/ling-3.0-flash-vl"
mode = "chat"
api_key_env = "OPENROUTER_API_KEY"
concurrency = 80
timeout = 1800

# Sampling protokolarny bez repetition penalty - jak przy gpt-oss. Kara za
# powtórzenia jest nie na miejscu przy modelu, który wraca do tych samych myśli
# w śladzie rozumowania.
#
# Ślad rozumowania wchodzi do tego samego budżetu co odpowiedź, stąd wysoki
# max_tokens. Siłę rozumowania przypinamy jawnie, żeby zmiana domyślnej wartości
# u dostawcy nie przesunęła po cichu wyniku.
[generation]
max_tokens = 40000
temperature = 0.9
top_p = 0.9
top_k = 40
reasoning_effort = "low"
