# inclusionai/ling-3.0-flash przez OpenRouter (wariant tekstowy, nie -vl).
[model]
id = "ling_3.0_flash"

[api]
base_url = "https://openrouter.ai/api/v1"
model = "inclusionai/ling-3.0-flash"
mode = "chat"
api_key_env = "OPENROUTER_API_KEY"
concurrency = 80
timeout = 300

# Sampling protokolarny bez repetition penalty - jak przy gpt-oss. Kara za
# powtórzenia jest nie na miejscu przy modelu, który wraca do tych samych myśli
# w śladzie rozumowania.
#
# Ten model NIE obsługuje `reasoning_effort` - wystawia tylko `reasoning`
# i `include_reasoning` - więc siły rozumowania nie da się tu przypiąć tak jak
# u DeepSeeka czy gpt-oss. Ślad, jeśli powstanie, wchodzi do tego samego budżetu
# co odpowiedź, stąd wysoki max_tokens.
[generation]
max_tokens = 40000
temperature = 0.9
top_p = 0.9
top_k = 40
