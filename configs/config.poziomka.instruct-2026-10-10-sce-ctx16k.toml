# Poziomka instruct 2026-10-10 (merge SCE), wariant nothink.
#   serwer: /media/nvme_2tb/maked/poziomka_train/poziomka-instruct-2026-10-10-sce
#
# Serwer: okno 16384, RoPE 640000, `--grammar-backend none`.
#
# Sampling ten sam co w calej serii v13, w merge'u 2026-10-07-sce i w run10,
# czyli przeniesiony - nie byl dobierany dla tego merge'a. Dzieki temu wiersz
# jest wprost porownywalny ze skladnikami i z poprzednim scalaniem.
#
# Sondy na tym merge'u nie puszczano. Na merge'u 2026-10-07-sce sampling
# w wariancie nothink nie robil roznicy: piec zestawow dalo 1,63-1,86, czyli
# rozrzut miedzy przebiegami.
[model]
id = "poziomka_instruct_2026_10_10_sce_ctx16k"

[chat_template]
enable_thinking = false

[api]
base_url = "http://192.168.1.26:2300/v1"
model = "/media/nvme_2tb/maked/poziomka_train/poziomka-instruct-2026-10-10-sce"
mode = "chat"
concurrency = 80
timeout = 600

[generation]
max_tokens = 7800
temperature = 0.6
top_p = 0.9
min_p = 0.05
frequency_penalty = 0.15
stop = ["<|im_end|>"]
