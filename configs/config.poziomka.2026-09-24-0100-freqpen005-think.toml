# Poziomka SFT 2026-09-24, checkpoint iter_0000100, wariant think.
#   cpral/poziomka_sft_2026_09_24_hf
#   lokalnie: poziomka_sft_run4_v12_16384_hf/iter_0000100
#
# Ten sam sampling co wariant no-think, żeby różnica w wyniku pochodziła
# wyłącznie z włączonego rozumowania. Uzasadnienie frequency_penalty = 0,05
# opisuje config.poziomka.2026-09-24-0100-freqpen005.toml.
#
# Uwaga: u modeli rozumujących ślad wchodzi do tego samego budżetu co
# odpowiedź, więc 7800 tokenów dzieli się na rozumowanie i treść. W serii
# 2026-09-21 to właśnie zabiło wariant think - model zaczynał rozumować
# i nie zamykał bloku przed wyczerpaniem budżetu, przez co 335 z 480 tur
# wyszło pustych.
[model]
id = "poziomka_2026_09_24_iter_0000100_freqpen005_think"

[chat_template]
enable_thinking = true

[api]
base_url = "http://192.168.1.26:2300/v1"
model = "/media/nvme_2tb/maked/poziomka_train/poziomka_sft_run4_v12_16384_hf/iter_0000100"
mode = "chat"
concurrency = 80
timeout = 600

# max_tokens 7800 - najwyższa wartość, przy której KAŻDA tura mieści się
# w oknie 16384 niezależnie od długości odpowiedzi z tury 1.
[generation]
max_tokens = 7800
temperature = 0.3
top_p = 0.9
frequency_penalty = 0.05
stop = ["<|im_end|>"]
