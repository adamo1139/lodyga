# Bielik-PL-Minitron-7B po SFT `nauka-lotnictwa-2`, wariant nothink.
#   serwer: /media/nvme_2tb/maked/bielik_train/bielik-pl-minitron-7b-nauka-lotnictwa-2
#   sglang, --reasoning-parser qwen3, --context-length 16384
#
# To NIE jest `Bielik-PL-Minitron-7B-v3.0-Instruct` z tabeli, tylko ten model po
# SFT tym samym szablonem czatu i zbiorem co `bielik-1.5b-nauka-lotnictwa-1`.
#
# TEST KARY ZA POWTORZENIA. Rozni sie od wiersza podstawowego TYLKO rodzajem
# kary: `frequency_penalty 0,05` zamiast `repetition_penalty 1,05`. Reszta bez
# zmian.
#
# Roznica miedzy nimi: repetition_penalty karze jednakowo kazdy token, ktory juz
# padl, wiec uderza w nazwy wlasne i konkrety. frequency_penalty skaluje kare
# liczba wystapien, wiec token uzyty raz praktycznie nie jest karany. Z tego
# powodu Poziomka przeszla na frequency_penalty po tym, jak rep 1,10 wycinalo
# konkrety.
#
# Odniesienie: ten sam model na repetition_penalty 1,05 dal 5,29 (3 przebiegi,
# rozrzut 0,05). `max_tokens 3500` tez
# jak w wierszu bazowym - w nothink i tak nie uwiera, bo odpowiedzi maja
# 966-1053 znaki.
#
# SERWUJ NA SGLANGU, nie na vLLM. Na vLLM przy enable_thinking=true slad
# rozumowania wpadal do `content` zamiast do `reasoning_content`, bez zadnych
# znacznikow `<think>`/`</think>`, i generacja dobijala do limitu (8615 znakow,
# finish=length). Harness nie mial wtedy po czym rozdzielic sladu od odpowiedzi
# i sedzia dostalby rozumowanie zamiast odpowiedzi. Na sglangu z parserem qwen3
# dziala poprawnie.
#
# Sonda (okno 16384): zero smieci przy temperaturze 0, zero pustych, urwanych
# i zapetlonych tur w nothink. Przelacznik rozumowania DZIALA (0/32 przy false,
# 16/16 przy true), inaczej niz w `Bielik-PL-Minitron-7B-v3.0-Instruct`, ktory ma
# w tabeli `brak`.
[model]
id = "bielik_minitron_7b_lotnictwo_2_fp005"

[chat_template]
enable_thinking = false

[api]
base_url = "http://192.168.1.26:2300/v1"
model = "/media/nvme_2tb/maked/bielik_train/bielik-pl-minitron-7b-nauka-lotnictwa-2"
mode = "chat"
concurrency = 80
timeout = 600

[generation]
max_tokens = 3500
temperature = 0.9
top_p = 0.9
top_k = 40
frequency_penalty = 0.05
stop = ["<|im_end|>"]
