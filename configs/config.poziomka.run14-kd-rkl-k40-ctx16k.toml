# Poziomka run 14: DESTYLACJA WIEDZY (nie SFT) - `destylowanie_1_rkl_k40`,
# odwrotna dywergencja KL po top-40 logitach, okno treningowe 8192, GBS 64,
# iter 635. Serwer podniesiony do 16384. Wariant nothink.
#   serwer: /media/nvme_2tb/maked/poziomka_train/poziomka_kd_run14_destylowanie_1_rkl_k40_8192_gbs64_hf/iter_0000635
#
# Sampler STANDARDOWY rodziny 10-10/10-13: `max_tokens 7800 / t0,6 / top_p 0,9 /
# min_p 0,05 / fp 0,15`. Ten sam mierzyl run11 (2,15), 10-13-della (2,13),
# 10-13-fusion (2,00) i cala rodzine merge'ow, wiec wiersze sa porownywalne.
#
# Sonda na oknie 8192 (przed restartem serwera), nothink: 0% smieci przy t0
# i t0,8, 0 pustych tur, 0-1 zapetlona na 16, przelacznik rozumowania dziala
# (0/16 przy false, 16/16 przy true).
#
# WARIANT THINK na oknie 8192 byl NIEUZYWALNY: 15-16 pustych tur na 16, mediana
# odpowiedzi 0 znakow. Model rozumowal w kazdej turze i ani razu nie domknal
# bloku w budzecie 3882 tokenow, ktory przy oknie 8192 wymuszala regula
# podwojnego budzetu. Przy oknie 16384 budzet rosnie do 7800, wiec warto to
# powtorzyc - ale osobnym configiem i po wlasnej sondzie.
#
# UWAGA z sondy 8k: przy t0,8 model sie ROZWLEKAL - srednia dlugosc odpowiedzi
# 2993 znaki wobec 853 przy t0,3, plus 2 urwane tury na 16. Tutaj idziemy na
# t0,6, czyli nizej, ale jesli w wyniku pojawi sie duzo urwanych tur, to jest
# pierwszy trop.
[model]
id = "poziomka_run14_kd_rkl_k40_ctx16k"

[chat_template]
enable_thinking = false

[api]
base_url = "http://192.168.1.26:2300/v1"
model = "/media/nvme_2tb/maked/poziomka_train/poziomka_kd_run14_destylowanie_1_rkl_k40_8192_gbs64_hf/iter_0000635"
mode = "chat"
concurrency = 80
timeout = 600

[generation]
max_tokens = 7800
temperature = 0.6
top_p = 0.9
min_p = 0.05
frequency_penalty = 0.15
stop = ["<|im_end|>"]
